<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img"><title>Same two transactions, two moments of arrival</title><desc>In the buffered regime both probes wait in the leader’s buffer and the one with more reward per unit of cost goes first, though it was sent second. Inside the window the leader is producing and takes them as they arrive, so the one sent first stays first unless the second lands within the scheduler’s batch.</desc><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}.mv,.fx{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}.b_a{animation-name:b_a}.b_y{animation-name:b_y}.w_a{animation-name:w_a}.w_y{animation-name:w_y}.xb_a{animation-name:xb_a}.xb_y{animation-name:xb_y}.xw_a{animation-name:xw_a}.xw_y{animation-name:xw_y}.wait{animation-name:wait}.go{animation-name:go}.r_b{animation-name:r_b}.r_w{animation-name:r_w}.wait{opacity:0}@keyframes b_a{0%{transform:translate(-626px,4px);opacity:0}0%{transform:translate(-626px,4px);opacity:0}3%{opacity:1}20%{transform:translate(-104px,-6px)}42%{transform:translate(-104px,-6px)}56%{transform:translate(0,0)}88%{transform:translate(0,0);opacity:1}96%,100%{transform:translate(0,0);opacity:0}}@keyframes xb_a{0%,54%{opacity:0}58%,88%{opacity:1}96%,100%{opacity:0}}@keyframes b_y{0%{transform:translate(-626px,28px);opacity:0}3%{transform:translate(-626px,28px);opacity:0}6%{opacity:1}23%{transform:translate(-104px,48px)}42%{transform:translate(-104px,48px)}56%{transform:translate(0,0)}88%{transform:translate(0,0);opacity:1}96%,100%{transform:translate(0,0);opacity:0}}@keyframes xb_y{0%,54%{opacity:0}58%,88%{opacity:1}96%,100%{opacity:0}}@keyframes w_a{0%{transform:translate(-626px,-20px);opacity:0}0%{transform:translate(-626px,-20px);opacity:0}3%{opacity:1}18%{transform:translate(-104px,-15px)}18%{transform:translate(-104px,-15px)}26%{transform:translate(0,0)}88%{transform:translate(0,0);opacity:1}96%,100%{transform:translate(0,0);opacity:0}}@keyframes xw_a{0%,24%{opacity:0}28%,88%{opacity:1}96%,100%{opacity:0}}@keyframes w_y{0%{transform:translate(-626px,-44px);opacity:0}3%{transform:translate(-626px,-44px);opacity:0}6%{opacity:1}21%{transform:translate(-104px,-39px)}21%{transform:translate(-104px,-39px)}29%{transform:translate(0,0)}88%{transform:translate(0,0);opacity:1}96%,100%{transform:translate(0,0);opacity:0}}@keyframes xw_y{0%,27%{opacity:0}31%,88%{opacity:1}96%,100%{opacity:0}}@keyframes wait{0%,40%{opacity:1}44%,100%{opacity:0}}@keyframes go{0%,40%{opacity:0}44%,96%{opacity:1}100%{opacity:0}}@keyframes r_b{0%,54%{opacity:0}58%,88%{opacity:1}96%,100%{opacity:0}}@keyframes r_w{0%,28%{opacity:0}32%,88%{opacity:1}96%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){.mv,.fx{animation:none}}</style><rect width="960" height="460" rx="16" fill="#152935"/><text x="32" y="38" fill="#e1faff" font-size="15" font-weight="600">Same two transactions, two moments of arrival</text><text x="32" y="88" fill="#4ba5c3" font-size="12" letter-spacing="1.5">BUFFERED</text><text x="32" y="106" fill="#82aac8" font-size="12">fired at slot F−5, about 1 s before the leader’s first slot</text><rect x="32" y="128" width="96" height="44" rx="8" fill="#0c1c25" stroke="rgba(225,250,255,.14)"/><text x="80" y="148" text-anchor="middle" fill="#e1faff">sender</text><text x="80" y="164" text-anchor="middle" fill="#82aac8" font-size="10.5">direct QUIC</text><line x1="132" y1="150" x2="600" y2="150" stroke="#82aac8" stroke-opacity=".5" stroke-dasharray="3 6"/><polygon points="600,146 608,150 600,154" fill="#82aac8" fill-opacity=".6"/><rect x="610" y="84" width="318" height="140" rx="10" fill="#0c1c25" stroke="rgba(225,250,255,.14)"/><rect x="626" y="112" width="104" height="96" rx="6" fill="none" stroke="rgba(225,250,255,.14)" stroke-dasharray="4 4"/><text x="678" y="104" text-anchor="middle" fill="#82aac8" font-size="11">buffer</text><text x="836" y="104" text-anchor="middle" fill="#82aac8" font-size="11">block F</text><text x="836" y="218" text-anchor="middle" fill="#82aac8" font-size="11">…</text><rect x="762" y="160" width="148" height="20" rx="3" fill="#4f86a3" opacity=".35"/><rect x="762" y="184" width="148" height="20" rx="3" fill="#4f86a3" opacity=".35"/><text x="32" y="276" fill="#4ba5c3" font-size="12" letter-spacing="1.5">INSIDE THE WINDOW</text><text x="32" y="294" fill="#82aac8" font-size="12">fired once slot F has started</text><rect x="32" y="316" width="96" height="44" rx="8" fill="#0c1c25" stroke="rgba(225,250,255,.14)"/><text x="80" y="336" text-anchor="middle" fill="#e1faff">sender</text><text x="80" y="352" text-anchor="middle" fill="#82aac8" font-size="10.5">direct QUIC</text><line x1="132" y1="338" x2="600" y2="338" stroke="#82aac8" stroke-opacity=".5" stroke-dasharray="3 6"/><polygon points="600,334 608,338 600,342" fill="#82aac8" fill-opacity=".6"/><rect x="610" y="272" width="318" height="140" rx="10" fill="#0c1c25" stroke="rgba(225,250,255,.14)"/><rect x="626" y="300" width="104" height="96" rx="6" fill="none" stroke="rgba(225,250,255,.14)" stroke-dasharray="4 4"/><text x="678" y="292" text-anchor="middle" fill="#82aac8" font-size="11">buffer</text><text x="836" y="292" text-anchor="middle" fill="#82aac8" font-size="11">block F</text><text x="836" y="406" text-anchor="middle" fill="#82aac8" font-size="11">…</text><rect x="762" y="300" width="148" height="20" rx="3" fill="#4f86a3" opacity=".35"/><rect x="762" y="324" width="148" height="20" rx="3" fill="#4f86a3" opacity=".35"/><g transform="translate(762,136)"><g class="mv b_a"><rect x="0" y="0" width="40" height="20" rx="5" fill="#8fb3cc"/><text x="20.0" y="14.5" text-anchor="middle" fill="#152935" font-weight="700">A</text></g><rect class="fx xb_a" x="44" y="0" width="104" height="20" rx="3" fill="#8fb3cc" opacity=".28"/></g><g transform="translate(762,112)"><g class="mv b_y"><rect x="0" y="0" width="40" height="20" rx="5" fill="#ffbf5e"/><text x="20.0" y="14.5" text-anchor="middle" fill="#152935" font-weight="700">Y</text></g><rect class="fx xb_y" x="44" y="0" width="104" height="20" rx="3" fill="#ffbf5e" opacity=".28"/></g><g transform="translate(762,348)"><g class="mv w_a"><rect x="0" y="0" width="40" height="20" rx="5" fill="#8fb3cc"/><text x="20.0" y="14.5" text-anchor="middle" fill="#152935" font-weight="700">A</text></g><rect class="fx xw_a" x="44" y="0" width="104" height="20" rx="3" fill="#8fb3cc" opacity=".28"/></g><g transform="translate(762,372)"><g class="mv w_y"><rect x="0" y="0" width="40" height="20" rx="5" fill="#ffbf5e"/><text x="20.0" y="14.5" text-anchor="middle" fill="#152935" font-weight="700">Y</text></g><rect class="fx xw_y" x="44" y="0" width="104" height="20" rx="3" fill="#ffbf5e" opacity=".28"/></g><text class="fx wait" x="610" y="76" fill="#4ba5c3" font-size="11" letter-spacing="1">LEADER  waiting for slot F</text><text class="fx go" x="610" y="76" fill="#4ba5c3" font-size="11" letter-spacing="1">LEADER  slot F, producing</text><text x="610" y="264" fill="#4ba5c3" font-size="11" letter-spacing="1">LEADER  slot F, producing</text><text class="fx r_b" x="136" y="194" fill="#e1faff">Sorted by reward per unit of cost: Y first.</text><text class="fx r_b" x="136" y="212" fill="#82aac8" font-size="12">Y left second and still goes first.</text><text class="fx r_w" x="136" y="382" fill="#e1faff">Taken as they arrive: A first.</text><text class="fx r_w" x="136" y="400" fill="#82aac8" font-size="12">Y overtakes only when both fall into one scheduling batch.</text><line x1="32" y1="244" x2="928" y2="244" stroke="rgba(225,250,255,.14)"/><rect x="32" y="428" width="40" height="20" rx="5" fill="#ffbf5e"/><text x="52.0" y="442.5" text-anchor="middle" fill="#152935" font-weight="700">Y</text><text x="80" y="443" fill="#82aac8" font-size="12">more reward per unit of cost</text><rect x="318" y="428" width="40" height="20" rx="5" fill="#8fb3cc"/><text x="338.0" y="442.5" text-anchor="middle" fill="#152935" font-weight="700">A</text><text x="366" y="443" fill="#82aac8" font-size="12">the reference probe</text><text x="570" y="443" fill="#82aac8" font-size="12">Y leaves 10 ms after A, slowed down here</text></svg>
